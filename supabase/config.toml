# Supabase local development config (supabase start / supabase db reset)
project_id = "author-reach-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/reset-password"]
jwt_expiry = 28800
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false          # staff + clients are invited; no public signup

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.invite]
subject = "You're invited to Author Reach Studio"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Author Reach Studio password"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "500MiB"

[analytics]
enabled = false

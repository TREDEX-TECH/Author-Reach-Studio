name: CI
on:
  push: { branches: [main, staging] }
  pull_request: { branches: [main, staging] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --no-audit --no-fund
      - name: Architecture & security regression tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Foundation verify
        run: node scripts/verify.mjs
      - name: Production build (no secrets required)
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
      - name: Fail if a real secret is committed
        run: |
          if grep -rInE 'sk_live_[A-Za-z0-9]+|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sb_secret_[A-Za-z0-9]+' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git .; then
            echo "::error::A credential-like string was found in the repository."; exit 1
          fi
          echo "No credential-like strings found."
